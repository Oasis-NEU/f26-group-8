<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The little picture on the browser tab (the "favicon"): the ScoutSearch
         binoculars on a navy square. The file is in public/, and anything in
         public/ is served from the top of the site, so it's just "/favicon.svg" -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>f26-group-8</title>
    <!-- Fonts for the About page, from Google Fonts. They load here, but only
         the About page uses them (see --font-display and --font-body in index.css).
         "preconnect" starts connecting to Google early so the fonts show up faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Overpass:wght@700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
